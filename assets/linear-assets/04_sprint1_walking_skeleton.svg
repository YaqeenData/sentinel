<g id="story"><rect x="60" y="110" width="1480" height="96" rx="4" fill="#101D2E" stroke="#22D3EE" stroke-width="2"/><text font-size="17" fill="#F1F5F9" text-anchor="start"><tspan x="80.0" y="152.4">As a data engineer, I want Sentinel to show the health of the latest incoming FHIR data window,</tspan><tspan x="80.0" y="174.2">so that I can verify that incoming data is usable even when the pipeline itself is running successfully.</tspan></text></g>
