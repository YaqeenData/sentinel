<g id="footer_note"><rect x="97" y="740" width="1406" height="54" rx="4" fill="#101D2E" stroke="#94A3B8" stroke-width="1.5"/><text font-size="15" fill="#F1F5F9" text-anchor="middle"><tspan x="800.0" y="771.6">Detectors flag data-quality signals only. Sentinel never diagnoses patients, labels medical risk, or scores patient health.</tspan></text></g>
