<g id="sprint1_goal"><rect x="68" y="240" width="576" height="76" rx="4" fill="#07111F" stroke="#17283D" stroke-width="1.5"/><text font-size="13" fill="#F1F5F9" text-anchor="start"><tspan x="80.0" y="265.4">Goal: Sentinel can take fresh synthetic FHIR observations through Kafka,</tspan><tspan x="80.0" y="282.0">process a basic data-quality window, store the result, and show one</tspan><tspan x="80.0" y="298.7">data-health metric end to end.</tspan></text></g>
<g id="sprint2_goal"><rect x="660" y="240" width="872" height="76" rx="4" fill="#07111F" stroke="#17283D" stroke-width="1.5"/><text font-size="13" fill="#F1F5F9" text-anchor="start"><tspan x="672.0" y="265.4">Goal: Sentinel detects a meaningful data-health problem, records it as an incident,</tspan><tspan x="672.0" y="282.0">and makes the system useful and operable through the Streamlit data-health</tspan><tspan x="672.0" y="298.7">dashboard.</tspan></text></g>
