<path class="arrow a-live" d="M388 310.0 H422" marker-end="url(#hl)"/>
<rect class="node" x="430" y="268" width="146" height="84" rx="10"/>
<text class="tag c" x="444" y="287">WINDOW</text>
<text class="t" x="444" y="310">Consumer</text>
<text class="s" x="444" y="327">Python consumer</text>
<text class="s" x="444" y="340">60-second windows</text>
<path class="arrow a-live" d="M582 310.0 H616" marker-end="url(#hl)"/>
<rect class="core" x="624" y="268" width="146" height="84" rx="10"/>
<text class="tag c" x="638" y="287">DETECT</text>
<text class="t" x="638" y="310">Detection engine</text>
<text class="s" x="638" y="327">5 detectors</text>
<text class="s" x="638" y="340">vs baselines</text>
<path class="arrow a-live" d="M776 310.0 H810" marker-end="url(#hl)"/>
<rect class="node" x="818" y="268" width="146" height="84" rx="10"/>
