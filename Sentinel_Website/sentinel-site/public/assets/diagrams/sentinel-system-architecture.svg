<text class="tag b" x="250" y="77">REFINE</text>
<text class="t" x="250" y="100">Bronze</text>
<text class="s" x="250" y="117">raw FHIR</text>
<text class="s" x="250" y="130">NDJSON</text>
<path class="arrow a-ref" d="M388 100.0 H422" marker-end="url(#hr)"/>
<rect class="node" x="430" y="58" width="146" height="84" rx="10"/>
