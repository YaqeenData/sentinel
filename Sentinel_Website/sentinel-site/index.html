<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111F" />
    <meta name="description" content="Sentinel — real-time data-health monitoring for streaming healthcare (FHIR) data. A controlled prototype on synthetic data." />
    <link rel="icon" type="image/svg+xml" href="./assets/brand/sentinel-logo.svg" />
    <script>
      try {
        var t = localStorage.getItem('sentinel-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>Sentinel · Data Health Monitoring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
