[project]
name = "sentinel"
version = "0.1.0"
description = "sentinel environment requirements"
authors = [
    {name = "Yaqeen Alhalal",email = "YaqeenAlhalal@outlook.sa"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-storage (>=3.16.0,<4.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "confluent-kafka (>=2.15.1,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "streamlit (>=1.65.0,<2.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "polars (>=2.0.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)"
]
